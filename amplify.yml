version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Recent @firebase/* releases require Node >=24.12; Amplify's default image ships Node 22.
        - nvm install 24
        - nvm use 24
        - node --version
        - yarn install
    build:
      commands:
        - env | grep -e NEXT_PUBLIC_ -e FIREBASE_ADMIN_ -e NEXT_SUPER_ADMINS_EMAILS -e NEXT_STRIPE_ALERT_EMAILS >> .env.production
        - yarn build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
